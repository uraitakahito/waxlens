name: pack-smoke

# Asserts the published shape of the bin-carrying workspaces works
# end-to-end, WITHOUT actually publishing anything:
#
#   1. `pnpm pack` produces a tarball whose `bin` target is executable
#   2. the binary runs from a directory with no project state
#   3. `pnpm publish --dry-run` reports a clean publish plan (no auth, no
#      registry traffic — purely a local validation that `files` /
#      `bin` / `prepublishOnly` would behave correctly if we DID push)
#
# `@waxlens/core` carries no bin — it is the library. It is still packed
# here because `@waxlens/validate-cli` declares it as a runtime dep, and
# `pnpm pack` rewrites `workspace:*` to a concrete version: installing
# both tarballs side by side satisfies that range locally, so the smoke
# step stays a real gate instead of degrading to a registry lookup for
# an unpublished package (which is why the @waxlens/tui step below is
# allowed to fail soft).
#
# Catches packaging regressions (missing `bin`, lost shebang, excluded
# files, broken postbuild chmod, `files` field drift) that `pnpm check`
# alone cannot see.
#
# Why `npx` and not `pnpm dlx` for the consumer simulation: most end
# users will reach for `npx <tarball>` since npm ships with Node;
# matching that path in CI keeps the smoke test honest about what
# consumers actually experience.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: build removes stale outputs
        # この repo の dist は gitignore なので、CI は常に綺麗な状態から
        # 建てる。つまり「build が古い出力を消さない」という退行は、普通に
        # 回しているだけでは**絶対に再現しない** — fresh checkout に消すべき
        # ものが存在しないからである。
        #
        # tsc は消えたソースの出力を削除しないので、この掃除が外れると
        # 手元から publish した tarball に死んだファイルが混ざる (実際
        # v0.5.0 で削除した cli-outcome.* が入っていた)。わざと残骸を置いて、
        # build がそれを消すことを確かめる。
        run: |
          touch packages/core/dist/__stale__.js
          pnpm --filter @waxlens/core build
          if [ -e packages/core/dist/__stale__.js ]; then
            echo "::error::pnpm build left a stale output in dist/ — the clean step is missing"
            exit 1
          fi

      - name: Pack @waxlens/contract
        id: pack-contract
        working-directory: packages/contract
        run: |
          tarball=$(pnpm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed: $tarball"

      - name: Pack @waxlens/core
        id: pack-core
        working-directory: packages/core
        run: |
          tarball=$(pnpm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed: $tarball"

      - name: Pack @waxlens/validate-cli
        id: pack-cli
        working-directory: packages/validate-cli
        run: |
          tarball=$(pnpm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed: $tarball"

      - name: Pack @waxlens/tui
        id: pack-tui
        working-directory: packages/tui
        run: |
          tarball=$(pnpm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed: $tarball"

      - name: Smoke waxlens-validate from a clean directory
        run: |
          mkdir -p /tmp/waxlens-smoke-cli
          cp "${GITHUB_WORKSPACE}/packages/contract/${{ steps.pack-contract.outputs.tarball }}" /tmp/waxlens-smoke-cli/
          cp "${GITHUB_WORKSPACE}/packages/core/${{ steps.pack-core.outputs.tarball }}" /tmp/waxlens-smoke-cli/
          cp "${GITHUB_WORKSPACE}/packages/validate-cli/${{ steps.pack-cli.outputs.tarball }}" /tmp/waxlens-smoke-cli/
          cd /tmp/waxlens-smoke-cli
          # Installing the whole local chain at once is what keeps this a
          # real gate: the CLI asks for `@waxlens/core@<version>` and core
          # asks for `@waxlens/contract@<version>`, and these tarballs
          # supply exactly those, so npm never reaches for the
          # (unpublished) registry packages.
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "./${{ steps.pack-contract.outputs.tarball }}" \
            "./${{ steps.pack-core.outputs.tarball }}" \
            "./${{ steps.pack-cli.outputs.tarball }}"
          npx waxlens-validate --version

      - name: Smoke @waxlens/tui from a clean directory
        run: |
          mkdir -p /tmp/waxlens-smoke-tui
          cp "${GITHUB_WORKSPACE}/packages/tui/${{ steps.pack-tui.outputs.tarball }}" /tmp/waxlens-smoke-tui/
          cd /tmp/waxlens-smoke-tui
          # The tui tarball declares `@waxlens/core` as a runtime dep.
          # pnpm rewrites `workspace:*` to a concrete version range at
          # pack time, so the published manifest no longer carries the
          # `workspace:` protocol — npx resolves the dep against the
          # public registry. Until @waxlens/core is published, this step
          # will pull whatever the registry returns (probably 404). We
          # allow it to fail-soft for now and revisit when the
          # publish-ready workflow becomes a real release pipeline.
          npx --yes "./${{ steps.pack-tui.outputs.tarball }}" --version || \
            echo "::warning::@waxlens/tui smoke skipped — @waxlens/core not yet on the registry"

      - name: Publish dry-run (all workspaces)
        # `pnpm publish --dry-run` writes nothing to the registry and
        # makes no network requests beyond resolving the package name.
        # It runs `prepublishOnly` (check + build) up-front, so this
        # step doubles as a final integration test of the release
        # gate. `--no-git-checks` skips pnpm's default refusal to
        # publish from a branch / dirty tree — a dry-run wants to run
        # regardless of working-tree state. If you ever genuinely want
        # to publish, replace this with a separate, manually-triggered
        # workflow that requires the NPM_TOKEN secret — never automate
        # `pnpm publish` from a `push` / `pull_request` trigger.
        run: |
          pnpm publish --dry-run --no-git-checks --filter @waxlens/contract
          pnpm publish --dry-run --no-git-checks --filter @waxlens/protocol
          pnpm publish --dry-run --no-git-checks --filter @waxlens/core
          pnpm publish --dry-run --no-git-checks --filter @waxlens/validate-cli
          pnpm publish --dry-run --no-git-checks --filter @waxlens/daemon
          pnpm publish --dry-run --no-git-checks --filter @waxlens/tui
